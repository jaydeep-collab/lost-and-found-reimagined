<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup | Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Lost<span>&</span>Found
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse Items</a>
            <a href="my-reports.html">My Reports</a>
        </nav>

             <a href="login.html" class="login-btn">Login</a>
    </header>


    <main>

        <section class="login-section">

            <div class="login-card">

                <p class="tagline">JOIN LOST & FOUND</p>

                <h1>Create Account</h1>

                <p class="login-subtitle">
                    Create an account to report and recover lost belongings.
                </p>


                <form class="signup-form">

                    <div class="form-group">

                        <label for="signupName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="signupPhone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="signupConfirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="signupConfirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-btn login-submit"
                    >
                        Create Account
                    </button>

                </form>


                <p class="signup-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Lost & Found — Reconnecting people with their belongings.
        </p>

    </footer>


    <script type="module" src="script.js"></script>

</body>
</html>
