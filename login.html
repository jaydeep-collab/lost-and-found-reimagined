<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Lost<span>&</span>Found
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="browse.html">Browse Items</a>
            <a href="my-reports.html">My Reports</a>
        </nav>

            <a href="login.html" class="login-btn">Login</a>
    </header>


    <main>

        <section class="login-section">

            <div class="login-card">

                <p class="tagline">WELCOME BACK</p>

                <h1>Login</h1>

                <p class="login-subtitle">
                    Login to manage your lost and found reports.
                </p>


                <form class="login-form">

                    <div class="form-group">
<label for="loginEmail">
    Email
</label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                     <label for="loginPassword">
                    Password
                    </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button type="submit" class="primary-btn login-submit">
                        Login
                    </button>

                </form>


                <p class="signup-text">
                    Don't have an account?
                    <a href="signup.html">Create an account</a>
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Lost & Found — Reconnecting people with their belongings.
        </p>

    </footer>


    <script type="module" src="script.js"></script>

</body>
</html>
